# Typecheck, build the frontend and run the Rust tests, including the S3 end-to-end tests
# against a throwaway rclone S3 server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Start test S3 server
        run: |
          curl -fsSL -o rclone.zip https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip
          unzip -q -j rclone.zip '*/rclone' -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/s3root/testbucket"
          "$RUNNER_TEMP/rclone" serve s3 --auth-key testkey,testsecret --addr 127.0.0.1:9123 "$RUNNER_TEMP/s3root" &
          sleep 2

      - name: Start multipart-capable test S3 server
        run: |
          docker run -d --name s3mock -p 9125:9090 -e initialBuckets=testbucket adobe/s3mock:3.12.0
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9125/ >/dev/null && break; sleep 1; done

      - name: Rust tests
        working-directory: src-tauri
        env:
          KYBL_TEST_ENDPOINT: http://127.0.0.1:9123
          KYBL_TEST_MULTIPART_ENDPOINT: http://127.0.0.1:9125
        # in a session of its own, with a process cap and a deadline: a test that signals its own
        # group, forks without end or hangs fails the step (with its log) instead of taking the
        # runner down with it
        timeout-minutes: 40
        run: |
          cargo test --lib --no-run
          ulimit -u 4000
          setsid timeout --kill-after=30s 25m cargo test --lib 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"
          exit "${PIPESTATUS[0]}"

      - name: Rust test log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/rust-tests.log" || true
