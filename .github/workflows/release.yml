# Builds the app for macOS (Apple Silicon + Intel), Windows, Linux, Android (.apk) and iOS (unsigned .ipa) and attaches the
# installers to a draft GitHub release. Run it by pushing a tag that matches the app version
# (`git tag v0.1.0 && git push --tags`) or from the Actions tab.
#
# macOS signing uses a self-signed certificate (no Apple Developer account). It is not
# notarized, so Gatekeeper asks once on first launch, but every release has the same
# signature, so the keychain keeps remembering "Always Allow" across updates.
# Secrets: MACOS_CERTIFICATE (base64 .p12) and MACOS_CERTIFICATE_PASSWORD. Without them the
# macOS build is ad-hoc signed and still works.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.rust-targets }}

      - run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::MACOS_CERTIFICATE is not set; the macOS build will be ad-hoc signed."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # self-signed, so the identity is listed as untrusted; codesign still signs with it.
          # Use the SHA-1 so it can't be confused with another identity of the same name.
          ID="$(security find-identity -p codesigning "$KC" | awk '/[0-9]\)/ {print $2; exit}')"
          [ -n "$ID" ] || { echo "::error::No signing identity found in the certificate"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ### Install

            - **macOS**: `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel). The app is signed but not notarized, so the first time macOS says it can't check the developer. Open **System Settings → Privacy & Security** and click **Open Anyway**. You only do this once.
            - **Windows**: `.msi` or `-setup.exe`. If SmartScreen warns, click **More info → Run anyway**.
            - **Linux**: `.AppImage`, `.deb` or `.rpm`.
            - **Android**: `Kybl.apk`. Open it on the phone and allow installs from your browser when asked. Updates install over it.
            - **iPhone / iPad**: `Kybl.ipa`, unsigned, for sideloading with [AltStore](https://altstore.io) or [SideStore](https://sidestore.io) (add the source `https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json` to get updates) or Sideloadly. A free Apple ID signs it for 7 days; AltStore and SideStore renew it on their own.

  # iOS without an Apple Developer account: build and archive with code signing switched off,
  # then zip the archived Kybl.app into an unsigned .ipa. Sideloading tools (AltStore, SideStore,
  # Sideloadly) sign it on the user's phone with their own Apple ID.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: aarch64-apple-ios

      - run: pnpm install --frozen-lockfile

      - name: Turn off code signing
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          P=src-tauri/gen/apple/kybl.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/' "$P"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$P" || { echo "::error::Could not turn off signing in $P"; exit 1; }

      # The build and archive succeed; only the final export step fails, because exporting
      # needs an Apple team. The archive is all we need.
      - name: Build
        run: pnpm tauri ios build --ci --target aarch64 || true

      - name: Package Kybl.ipa and the AltStore source
        run: |
          APP=src-tauri/gen/apple/build/kybl_iOS.xcarchive/Products/Applications/Kybl.app
          [ -x "$APP/Kybl" ] || { echo "::error::The iOS build did not produce $APP"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Kybl.ipa Payload)
          node scripts/altstore-source.mjs out/Kybl.ipa "${{ github.repository }}" out/altstore-source.json

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            out/Kybl.ipa
            out/altstore-source.json

  # Attach the iOS files to the draft release the desktop jobs created.
  ios-release:
    needs: [build, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: out
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "v$V" out/Kybl.ipa out/altstore-source.json --clobber --repo "${{ github.repository }}"

  # Android: one APK for ARM phones (arm64 + armv7), signed with the release key from the
  # ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets.
  # Every release must use the same key, or Android refuses to install the update.
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); add the NDK and platform we build with.
      - name: Android SDK and NDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - run: pnpm install --frozen-lockfile

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "::error::ANDROID_KEYSTORE is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: pnpm tauri android build --apk --ci --target aarch64 armv7

      - name: Package Kybl.apk
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk out/Kybl.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/Kybl.apk

  # Attach the APK to the draft release the desktop jobs created.
  android-release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "v$V" out/Kybl.apk --clobber --repo "${{ github.repository }}"
