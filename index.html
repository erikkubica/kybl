<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kybl</title>
    <style>
      /* painted before any script runs, so a phone never flashes white on launch */
      html { background: #f8f6f5; --k-line: #1e1a1a; }
      @media (prefers-color-scheme: dark) { html { background: #1d1a1a; --k-line: #f1efed; } }
      #splash { display: none; }
      .phone #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: inherit;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .phone #splash svg { width: 96px; height: 96px; filter: drop-shadow(0 12px 20px rgba(150, 40, 15, 0.25)); }
      .phone #splash.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
    </style>
    <script>
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || location.search.includes("mobile")) {
        document.documentElement.classList.add("phone");
      }
    </script>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <path d="M40 76 C40 6 160 6 160 76" fill="none" stroke="var(--k-line)" stroke-width="7" stroke-linecap="round"/>
          <rect x="80" y="16" width="40" height="15" rx="7.5" fill="#ffc93c"/>
          <rect x="86" y="19" width="22" height="3.4" rx="1.7" fill="#fff" opacity="0.45"/>
          <path d="M38 76 L54 168 A46 12 0 0 0 146 168 L162 76 A62 16 0 0 1 38 76 Z" fill="#d9381f"/>
          <path d="M149 100 L139 162" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="13" stroke-linecap="round"/>
          <path d="M52 100 L57 130" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
          <path d="M54 168 A46 12 0 0 0 146 168" fill="none" stroke="var(--k-line)" stroke-width="4.5" stroke-linecap="round"/>
          <ellipse cx="100" cy="76" rx="66" ry="18" fill="var(--k-line)"/>
          <ellipse cx="100" cy="76" rx="56" ry="11.5" fill="#8f1f0c"/>
          <path d="M44 70 A60 14 0 0 1 78 60" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2.6" stroke-linecap="round"/>
          <g fill="#fff"><circle cx="62" cy="106" r="5.2"/><circle cx="138" cy="106" r="5.2"/><circle cx="66" cy="134" r="5.2"/><circle cx="134" cy="134" r="5.2"/><circle cx="76" cy="157" r="5.2"/><circle cx="100" cy="163" r="5.2"/><circle cx="124" cy="157" r="5.2"/></g>
          <ellipse cx="85" cy="114" rx="8.5" ry="10" fill="#fff"/><ellipse cx="115" cy="114" rx="8.5" ry="10" fill="#fff"/>
          <circle cx="86.5" cy="116" r="5" fill="#1e1a1a"/><circle cx="116.5" cy="116" r="5" fill="#1e1a1a"/>
          <circle cx="88.4" cy="113.8" r="1.8" fill="#fff"/><circle cx="118.4" cy="113.8" r="1.8" fill="#fff"/>
          <path d="M89 133 Q100 144 111 133" fill="none" stroke="#1e1a1a" stroke-width="4.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
