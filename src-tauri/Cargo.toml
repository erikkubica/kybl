[package]
name = "kybl"
version = "0.3.2"
description = "A fast, native S3 browser for any S3-compatible storage"
authors = ["Kybl contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "kybl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# links the Swift side of "Connect Kybl Storage" (gen/apple/KyblConnect) on iOS
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default features would compile two HTTP/TLS stacks (hyper 0.14 + rustls 0.21 + ring, and
# hyper 1 + rustls 0.23 + aws-lc) plus SigV4a crypto. One stack, on ring, is enough; the client is
# built in `state::http_client`.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
bytes = "1"
http-body = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time", "rt-multi-thread", "macros"] }
# "Connect Kybl Storage" talks JSON to the account API. These are already in the tree through the
# S3 client (same hyper and rustls on ring), so the sign-in adds no second HTTP stack.
# "server": the loopback media server (storage/media.rs) where URI schemes can't play media
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
http-body-util = "0.1"
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
percent-encoding = "2"
mime_guess = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
# ThumbHash: a ~25-byte blurry placeholder per photo (thumbhash.rs); no dependencies of its own
thumbhash = "0.1"
tauri-plugin-fs = "2"

# WP0 storage core: one `dyn Storage` trait for S3, local disk and (later) other providers.
# Both are already in the tree through the S3 client.
async-trait = "0.1"
futures-util = "0.3"

# WP-A1 network backends, on one HTTP/TLS stack on ring (`cargo tree -i aws-lc-rs` stays empty).
# WebDAV is hand-written on reqwest: OpenDAL's WebDAV writer holds a whole file in memory before
# sending it. OpenDAL serves Azure Blob and GCS (and the sign-in providers later). FTP uses
# suppaftp directly for implicit FTPS, which OpenDAL's FTP lacks. SFTP is russh, which runs on
# every OS (OpenDAL's SFTP spawns the system `ssh`).
opendal = { version = "=0.59.5", default-features = false, features = ["services-azblob", "services-gcs", "executors-tokio"] }
opendal-http-transport-reqwest = { version = "=0.59.5", default-features = false, features = ["rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = "0.42"
suppaftp = { version = "13", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "4.0"
# WP-B1 copying between connections: the job database (jobs.db, and `db.rs` for the other
# engines' databases; SQLite is compiled in, also for iOS and Android), and Content-MD5 on every
# part sent to S3 (md-5 is already in the tree through the S3 client; base64 for the header).
rusqlite = { version = "0.40", features = ["bundled"] }
md-5 = "0.11"
# base64: GCS service account keys (WP-A1), the Content-MD5 header (WP-B1), sign-in (WP-A2)
base64 = "0.22"
# WP-A2 cloud drives (Google Drive, OneDrive, Dropbox) and their sign-in are hand-written on the
# reqwest/rustls lines above (one HTTP stack, rustls on ring).

# WP-E1 two-way sync (sync.db goes through rusqlite and md-5 from WP-B1 above): paths compared
# Unicode-normalised (macOS keeps names decomposed), and a downloaded file's time set to the
# remote one.
unicode-normalization = "0.1"
filetime = "0.2"

# Archives (src/archive): browse, extract and compress .zip, .tar and .tar.gz. Deflate only (no
# AES, bzip2, zstd or lzma); flate2 is already in the tree, here on its pure-Rust miniz backend.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Desktop only: the menu-bar icon, launch at login and two-way folder sync (a phone has no folders
# to keep in sync and no menu bar).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
notify = "8"
notify-debouncer-full = "0.7"
ignore = "0.4"
tauri-plugin-autostart = "2"
trash = "5"
# WP-A1/WP-A2: the system's trusted roots for WebDAV, FTPS and the cloud drive APIs (phones bundle webpki-root-certs below)
rustls-native-certs = "0.8"

# WP-E4 "Mount as drive" (desktop only): a WebDAV server on 127.0.0.1 that Finder, GVFS or
# Explorer mount. dav-server brings the protocol (PROPFIND, LOCK, ranges); its local-disk and
# in-memory file systems are left out (`default-features = false`): files come from `Storage`.
# A table of its own (an equivalent cfg spelled differently) so it merges cleanly beside the
# desktop table above.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
dav-server = { version = "0.12", default-features = false, features = ["proppatch"] }
# Finder sends decomposed (NFD) names; keys are usually composed (NFC)
unicode-normalization = "0.1"

# Local disk: renames that never replace an existing file (renameat2 / renamex_np); already in
# the tree through tokio
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Phones have no root certificate files for rustls to load: trust Mozilla's root set instead
# (see `state::http_client`).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
webpki-root-certs = "1"
base64 = "0.22"
# the same rustls the S3 client uses, to hand the account API client those roots too
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# macOS: files put on the clipboard (the pasteboard takes file URLs, see platform.rs), and items
# dragged out to other apps as files or file promises (platform/drag_out.rs). The AppKit and
# Foundation bindings and block2 are already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }

# Windows, Linux: items dragged out to other apps as files (platform/drag_out.rs)
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
drag = "2"

# iOS: to stop the web view insetting itself for the notch and home bar (the page handles the
# safe areas itself, see mobile.css)
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

# Android: the transfer notification is driven over JNI on the application context, which
# outlives the app's screen (src/transfer_notice.rs)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# The OS keychain everywhere but Android, which keeps secrets in the app's private storage
# (see `state::vault`).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
# The app waits on the network, not the CPU: optimizing for size costs nothing noticeable and
# saves about a third of the binary.
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# WP-A2: a tiny local HTTP server standing in for Drive, Graph, Dropbox and the token endpoints
hyper = { version = "1", features = ["server", "http1"] }
