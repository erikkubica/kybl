[package]
name = "kybl"
version = "0.3.2"
description = "A fast, native S3 browser for any S3-compatible storage"
authors = ["Kybl contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "kybl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# links the Swift side of "Connect Kybl Storage" (gen/apple/KyblConnect) on iOS
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default features would compile two HTTP/TLS stacks (hyper 0.14 + rustls 0.21 + ring, and
# hyper 1 + rustls 0.23 + aws-lc) plus SigV4a crypto. One stack, on ring, is enough; the client is
# built in `state::http_client`.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
bytes = "1"
http-body = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time", "rt-multi-thread", "macros"] }
# "Connect Kybl Storage" talks JSON to the account API. These are already in the tree through the
# S3 client (same hyper and rustls on ring), so the sign-in adds no second HTTP stack.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
http-body-util = "0.1"
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
percent-encoding = "2"
mime_guess = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
tauri-plugin-fs = "2"

# WP0 storage core: one `dyn Storage` trait for S3, local disk and (later) other providers.
# Both are already in the tree through the S3 client.
async-trait = "0.1"
futures-util = "0.3"

# WP-B1 copying between connections: the job database (jobs.db, and `db.rs` for the other
# engines' databases; SQLite is compiled in, also for iOS and Android), and Content-MD5 on every
# part sent to S3 (md-5 is already in the tree through the S3 client; base64 for the header).
rusqlite = { version = "0.40", features = ["bundled"] }
md-5 = "0.11"
base64 = "0.22"

# Desktop only: the menu-bar icon, launch at login and two-way folder sync (a phone has no folders
# to keep in sync and no menu bar).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
notify = "8"
notify-debouncer-full = "0.7"
ignore = "0.4"
tauri-plugin-autostart = "2"
trash = "5"

# Phones have no root certificate files for rustls to load: trust Mozilla's root set instead
# (see `state::http_client`).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
webpki-root-certs = "1"
base64 = "0.22"
# the same rustls the S3 client uses, to hand the account API client those roots too
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# iOS: to stop the web view insetting itself for the notch and home bar (the page handles the
# safe areas itself, see mobile.css)
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

# Android: the transfer notification is driven over JNI on the application context, which
# outlives the app's screen (src/transfer_notice.rs)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# The OS keychain everywhere but Android, which keeps secrets in the app's private storage
# (see `state::vault`).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
# The app waits on the network, not the CPU: optimizing for size costs nothing noticeable and
# saves about a third of the binary.
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
